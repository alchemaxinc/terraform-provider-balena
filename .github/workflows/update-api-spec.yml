name: Update Balena API spec

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Whether the generated resources are registered in the published provider.
  # While false, a surface change cannot reach users, so its pull request uses
  # `build:`, which runs the acceptance tests without cutting a release.
  SURFACE_RELEASED: "false"

jobs:
  detect:
    name: Compare pinned and latest upstream release
    runs-on: ubuntu-latest

    outputs:
      current: ${{ steps.versions.outputs.current }}
      latest: ${{ steps.versions.outputs.latest }}
      needs_update: ${{ steps.versions.outputs.needs_update }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < schema/VERSION)
          LATEST=$(gh api repos/balena-io/open-balena-api/tags --jq '.[0].name')

          # Upstream controls the tag, and it flows into branch names, titles
          # and shell steps: accept only a plain semantic version.
          for TAG in "$CURRENT" "$LATEST"; do
            if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refusing tag '$TAG': expected vMAJOR.MINOR.PATCH."
              exit 1
            fi
          done

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Spec is up to date at $CURRENT"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT -> $LATEST"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

  extract:
    name: Extract upstream model
    needs: detect
    if: needs.detect.outputs.needs_update == 'true'
    runs-on: ubuntu-latest

    # Runs upstream code (inside a container with no network for the export
    # itself). No secrets, no write token and no caches reach this job.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Extract
        env:
          LATEST: ${{ needs.detect.outputs.latest }}
        run: bash schema/extract.sh "$LATEST" "$RUNNER_TEMP/spec-work"

      - name: Upload raw model
        uses: actions/upload-artifact@v7
        with:
          name: raw-model
          path: |
            ${{ runner.temp }}/spec-work/config.json
            ${{ runner.temp }}/spec-work/provenance.json
          retention-days: 7
          if-no-files-found: error

  regenerate:
    name: Regenerate spec and code
    needs: [detect, extract]
    runs-on: ubuntu-latest

    # Trusted code from the default branch processes the extracted data.
    permissions:
      contents: read

    outputs:
      outcome: ${{ steps.regen.outcome }}
      kind: ${{ steps.classify.outputs.kind }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download raw model
        uses: actions/download-artifact@v8
        with:
          name: raw-model
          path: ${{ runner.temp }}/raw

      - name: Regenerate, build and test
        id: regen
        continue-on-error: true
        env:
          LATEST: ${{ needs.detect.outputs.latest }}
          RAW: ${{ runner.temp }}/raw
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/regen.log") 2>&1
          cp schema/api/v6.json "$RUNNER_TEMP/old-v6.json"
          echo "$LATEST" > schema/VERSION

          # Accept the provenance record only in its exact expected shape.
          jq -e --arg tag "$LATEST" '
            (keys == ["commit","node","node_image","npm","package_lock_sha256","pinejs","raw_config_sha256","tag","upstream"])
            and .tag == $tag
            and .upstream == "https://github.com/balena-io/open-balena-api"
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.package_lock_sha256 | test("^[0-9a-f]{64}$"))
            and (.raw_config_sha256 | test("^[0-9a-f]{64}$"))
            and (.node_image | test("^node@sha256:[0-9a-f]{64}$"))
            and ([.pinejs, .node, .npm] | all(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")))
          ' "$RAW/provenance.json" > /dev/null
          jq --sort-keys . "$RAW/provenance.json" > schema/api/provenance.json

          go run ./cmd/schemagen normalize "$RAW/config.json" schema/api/v6.json
          go generate ./...
          go build ./...
          go vet ./...
          make test-unit

      - name: Classify the surface change
        id: classify
        if: steps.regen.outcome == 'success'
        run: |
          set -euo pipefail
          go run ./cmd/schemagen diff "$RUNNER_TEMP/old-v6.json" schema/api/v6.json > "$RUNNER_TEMP/diff.json"
          echo "kind=$(jq -r .kind "$RUNNER_TEMP/diff.json")" >> "$GITHUB_OUTPUT"

      - name: Package the changes
        run: |
          set -euo pipefail
          git add -A schema internal/generated
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          touch "$RUNNER_TEMP/diff.json" "$RUNNER_TEMP/regen.log"

      - name: Upload changes
        uses: actions/upload-artifact@v7
        with:
          name: changes
          path: |
            ${{ runner.temp }}/changes.patch
            ${{ runner.temp }}/diff.json
            ${{ runner.temp }}/regen.log
          retention-days: 7

  publish:
    name: Open pull request
    needs: [detect, extract, regenerate]
    if: always() && needs.detect.outputs.needs_update == 'true' && needs.regenerate.result != 'cancelled'
    runs-on: ubuntu-latest

    outputs:
      branch: ${{ steps.push.outputs.branch }}
      copilot: ${{ steps.plan.outputs.copilot }}
      title: ${{ steps.plan.outputs.title }}
      problem: ${{ steps.plan.outputs.problem }}

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq ".id")
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Download changes
        if: needs.regenerate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: changes
          path: ${{ runner.temp }}/changes

      - name: Sweep orphaned update branches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Copilot copies an update commit onto a branch of its own, leaving the
          # one pushed here behind once its task finishes. A running task reads
          # that branch minutes after the push, so keep recent ones.
          CUTOFF=$(date -u -d '6 hours ago' +%s)
          gh api "repos/${REPOSITORY}/branches" --paginate --jq '.[].name' \
            | { grep -E '^[a-z]+/api-spec-v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | while read -r BRANCH; do
                if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
                  continue
                fi
                PUSHED=$(gh api "repos/${REPOSITORY}/commits/${BRANCH}" --jq '.commit.committer.date' || true)
                if [ -z "$PUSHED" ] || [ "$(date -u -d "$PUSHED" +%s)" -gt "$CUTOFF" ]; then
                  continue
                fi
                gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${BRANCH}"
                echo "::notice::Deleted orphaned branch ${BRANCH}"
              done

      - name: Decide what to open
        id: plan
        env:
          EXTRACT_RESULT: ${{ needs.extract.result }}
          REGEN_RESULT: ${{ needs.regenerate.result }}
          REGEN_OUTCOME: ${{ needs.regenerate.outputs.outcome }}
          KIND: ${{ needs.regenerate.outputs.kind }}
          LATEST: ${{ needs.detect.outputs.latest }}
        run: |
          set -euo pipefail
          COPILOT=false
          AUTO_MERGE=false
          PROBLEM=""
          if [ "$EXTRACT_RESULT" != "success" ]; then
            PROBLEM="Extracting the upstream model failed."
          elif [ "$REGEN_RESULT" != "success" ] || [ "$REGEN_OUTCOME" != "success" ]; then
            PROBLEM="Regenerating, building or testing failed."
          fi

          if [ -n "$PROBLEM" ]; then
            if [ "$SURFACE_RELEASED" = "true" ]; then TYPE=fix; else TYPE=build; fi
            COPILOT=true
          else
            case "$KIND" in
              none) TYPE=chore; AUTO_MERGE=true ;;
              additive)
                if [ "$SURFACE_RELEASED" = "true" ]; then TYPE=feat; else TYPE=build; fi
                AUTO_MERGE=true ;;
              breaking)
                # A breaking change releases a major version: leave it for a human.
                if [ "$SURFACE_RELEASED" = "true" ]; then TYPE='feat!'; else TYPE=build; AUTO_MERGE=true; fi ;;
              *) echo "::error::Unknown change kind '$KIND'"; exit 1 ;;
            esac
          fi

          if [ "$TYPE" = chore ]; then
            TITLE="chore: bump schema VERSION to ${LATEST}"
          else
            TITLE="${TYPE}: update balena API model to ${LATEST}"
          fi
          {
            echo "type=$TYPE"
            echo "slug=${TYPE%!}"
            echo "title=$TITLE"
            echo "copilot=$COPILOT"
            echo "auto_merge=$AUTO_MERGE"
            echo "problem=$PROBLEM"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LATEST: ${{ needs.detect.outputs.latest }}
          SLUG: ${{ steps.plan.outputs.slug }}
          TITLE: ${{ steps.plan.outputs.title }}
          CHANGES: ${{ runner.temp }}/changes
        run: |
          set -euo pipefail
          BRANCH="${SLUG}/api-spec-${LATEST}"
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            echo "::notice::A pull request is already open for ${BRANCH}."
            exit 0
          fi

          git checkout -b "$BRANCH"
          if [ -s "$CHANGES/changes.patch" ]; then
            git apply --index "$CHANGES/changes.patch"
          else
            # Nothing was regenerated: carry the version bump for Copilot to finish.
            echo "$LATEST" > schema/VERSION
            git add schema/VERSION
          fi
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.push.outputs.branch != '' && steps.plan.outputs.copilot != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
          TITLE: ${{ steps.plan.outputs.title }}
          CURRENT: ${{ needs.detect.outputs.current }}
          LATEST: ${{ needs.detect.outputs.latest }}
          AUTO_MERGE: ${{ steps.plan.outputs.auto_merge }}
          CHANGES: ${{ runner.temp }}/changes
        run: |
          set -euo pipefail
          {
            echo "Regenerated from open-balena-api \`${CURRENT}\` → \`${LATEST}\` by \`schema/extract.sh\` and \`schemagen\`."
            echo
            # Rendered by schemagen, which drops control characters and backticks from upstream text.
            jq -r .markdown "$CHANGES/diff.json"
            echo
            if [ "$AUTO_MERGE" = true ]; then
              echo "This pull request merges automatically once the checks pass."
            else
              echo "This change is breaking and releases a major version, so it waits for a maintainer."
            fi
          } > "$RUNNER_TEMP/body.md"
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.number != '' && steps.plan.outputs.auto_merge == 'true'
        uses: alchemaxinc/composite-toolbox/merge-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.pr.outputs.number }}
          merge-method: squash

      - name: Close superseded pull requests
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^[a-z]+/api-spec-v")) | "\(.number) \(.headRefName)"' \
            | while read -r NUMBER HEAD; do
                if [ "$HEAD" != "$BRANCH" ]; then
                  gh pr close "$NUMBER" --delete-branch --comment "Superseded by the update on \`${BRANCH}\`."
                fi
              done

  start-copilot-task:
    name: Start Copilot task
    needs: [detect, publish]
    if: always() && needs.publish.outputs.copilot == 'true' && needs.publish.outputs.branch != ''
    runs-on: ubuntu-latest

    # Needs a deployment branch rule limited to `main`: workflow_dispatch runs the
    # definition from the dispatched ref, so a plain repository secret would be
    # readable by a modified copy of this workflow on any branch.
    environment: copilot-agent

    # Holds a long-lived user PAT: the agent tasks API rejects GitHub App
    # installation tokens. No checkout and no third-party actions, so nothing
    # here can be coerced into reading it.
    permissions: {}

    env:
      # Identifiers the API accepts are not all published, and change as models
      # are released. An unknown or disabled one fails the request outright.
      COPILOT_MODEL: claude-opus-5

    steps:
      - name: Start Copilot cloud agent task
        id: task
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          TITLE: ${{ needs.publish.outputs.title }}
          PROBLEM: ${{ needs.publish.outputs.problem }}
          LATEST: ${{ needs.detect.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret COPILOT_AGENT_TOKEN is not set. The agent tasks API accepts user-to-server tokens only."
            exit 1
          fi

          PROMPT=$(gh api "repos/${REPOSITORY}/contents/.github/prompts/api-spec-update.md?ref=main" --jq .content | base64 -d)
          PROMPT="${PROMPT//VERSION_PLACEHOLDER/$LATEST}"
          PROMPT="${PROMPT//BRANCH_PLACEHOLDER/$BRANCH}"
          PROMPT="${PROMPT//TITLE_PLACEHOLDER/$TITLE}"
          PROMPT="${PROMPT//PROBLEM_PLACEHOLDER/$PROBLEM}"
          PROMPT="${PROMPT//RUN_URL_PLACEHOLDER/$RUN_URL}"
          if printf '%s' "$PROMPT" | grep -q 'PLACEHOLDER'; then
            echo "::error::Unsubstituted placeholder left in the agent prompt."
            exit 1
          fi

          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg head "refs/heads/$BRANCH" \
            --arg model "$COPILOT_MODEL" \
            '{prompt: $prompt, model: $model, head_ref: $head, base_ref: "refs/heads/main", create_pull_request: true}' \
            | gh api --method POST -H "Accept: application/vnd.github+json" \
              "agents/repos/${REPOSITORY}/tasks" --input -)

          TASK_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$TASK_ID" ]; then
            echo "::error::Agent task was not created."
            exit 1
          fi
          echo "::notice::Copilot task ${TASK_ID} started on ${BRANCH} (${COPILOT_MODEL})"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Retitle the pull request Copilot opened
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          TITLE: ${{ needs.publish.outputs.title }}
        run: |
          set -euo pipefail

          # The tasks API takes no title and the agent cannot set one itself, so
          # it opens the pull request as "[WIP] ...". The title decides the
          # release type once squashed, so set it here.
          OWNER="${REPOSITORY%%/*}"
          for _ in $(seq 1 30); do
            TASK=$(gh api "agents/repos/${REPOSITORY}/tasks/${TASK_ID}" || true)
            PR_ID=$(printf '%s' "$TASK" | jq -r '[.artifacts[]? | select(.type == "pull") | .data.id? | numbers] | last // empty')
            HEAD_REF=$(printf '%s' "$TASK" | jq -r '[.artifacts[]? | select(.type == "branch") | .data.head_ref? | strings] | last // empty')
            if [ -n "$PR_ID" ] && [ -n "$HEAD_REF" ]; then
              PR_NUMBER=$(gh api "repos/${REPOSITORY}/pulls?state=open&head=${OWNER}:${HEAD_REF}" \
                --jq "[.[] | select(.id == ${PR_ID}) | .number] | first // empty" || true)
              if [ -n "$PR_NUMBER" ]; then
                break
              fi
            fi
            sleep 10
          done

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::Copilot has not opened a pull request yet. Retitle it to '${TITLE}' by hand."
            exit 0
          fi
          # Leave it a draft: marking it ready would start CI on unfinished work.
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" -f title="$TITLE" > /dev/null
          echo "::notice::Retitled pull request #${PR_NUMBER} to '${TITLE}'"
