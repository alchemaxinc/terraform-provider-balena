name: Update GitHub Actions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Run every Sunday at midnight

jobs:
  update-actions:
    runs-on: ubuntu-latest
    # The GitHub App key lives in this environment, which only `main` may use.
    environment: housekeeping
    permissions:
      contents: read
    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Pushes a branch that edits workflow files, opens the pull request and enables auto-merge.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Update GitHub Actions
        uses: alchemaxinc/update-deps/actions@v2
        with:
          token: ${{ steps.app.outputs.token }}
          auto-merge: "true"
          merge-method: "squash"
          base-branch: "main"
          file-glob: ".github/**/*.yml"
          branch-prefix: "update-actions"
          pr-title: "chore: update GitHub Actions"
          commit-message: "chore: update github actions"
