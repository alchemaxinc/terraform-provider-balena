name: Update Provider Version Examples

on:
  workflow_run:
    workflows: ["Semantic Versioning and Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Full semantic version to sync to, for example 2.0.0. Defaults to the latest tag."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-provider-version-examples:
    name: Update provider version examples
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          shallow: "false"
          token: ${{ steps.app.outputs.token }}

      - name: Determine version
        id: get-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            git fetch --tags
            TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "")
            VERSION="${TAG#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No version found"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Version '$VERSION' is not a full semantic version. Skipping."
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync provider version examples
        id: sync-version
        if: steps.get-version.outputs.version != ''
        uses: alchemaxinc/composite-toolbox/sync-terraform-version-in-docs@v1
        with:
          mode: set
          provider-source: "alchemaxinc/balena"
          files: "README.md examples/provider/provider.tf"
          version: ${{ steps.get-version.outputs.version }}

      - name: Setup Go
        if: steps.sync-version.outputs.files_updated != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Terraform
        if: steps.sync-version.outputs.files_updated != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install tfplugindocs
        if: steps.sync-version.outputs.files_updated != ''
        env:
          TFPLUGINDOCS_VERSION: "0.24.0"
        run: go install "github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v${TFPLUGINDOCS_VERSION}"

      - name: Regenerate docs
        if: steps.sync-version.outputs.files_updated != ''
        env:
          PRETTIER_VERSION: "3.3.3"
        run: |
          GO_BIN="$(go env GOPATH)/bin"
          export PATH="${GO_BIN}:${PATH}"
          make docs
          npx --yes "prettier@${PRETTIER_VERSION}" --write docs/

      - name: Format updated files list
        id: format-files
        if: steps.sync-version.outputs.files_updated != ''
        env:
          FILES_UPDATED: ${{ steps.sync-version.outputs.files_updated }}
        run: |
          {
            echo "files_list<<EOF"
            read -r -a files <<< "$FILES_UPDATED"
            for file in "${files[@]}"; do
              echo "- \`$file\`"
            done
            echo "- \`docs/index.md\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        if: steps.sync-version.outputs.files_updated != ''
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: "main"
          branch-prefix: "update-provider-version-examples"
          files: "${{ steps.sync-version.outputs.files_updated }} docs/index.md"
          commit-message: "docs: update provider examples to v${{ steps.get-version.outputs.version }}"
          pr-title: "docs: update provider examples to v${{ steps.get-version.outputs.version }}"
          pr-body: |
            Updates the documented Terraform provider version constraint to the
            latest release.

            **New version**: `${{ steps.get-version.outputs.version }}`

            **Files updated**:
            ${{ steps.format-files.outputs.files_list }}

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_number != ''
        uses: alchemaxinc/composite-toolbox/merge-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pr_number }}
          merge-method: "squash"
