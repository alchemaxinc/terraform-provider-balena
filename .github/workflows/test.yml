name: Test

on:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - &checkout-code
        name: Checkout code (shallow)
        uses: actions/checkout@v7

      - &setup-go
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      # terraform-plugin-testing uses the terraform on PATH. Without one it downloads a copy for each test, and running
      # a freshly written binary while parallel tests write theirs can fail with "text file busy".
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run unit tests
        run: make test-unit

  build:
    runs-on: ubuntu-latest

    steps:
      - *checkout-code
      - *setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  contract:
    runs-on: ubuntu-latest
    needs: [unit-test, build]
    if: &live-api-gate >-
      github.event_name == 'workflow_call'
      || !startsWith(github.event.pull_request.title, 'chore')

    environment: &live-api-environment ${{ github.event_name == 'workflow_call' && 'production' || 'development' }}

    steps:
      - *checkout-code
      - *setup-go

      # Read-only GETs: every generated table and every column a spec or hook uses must exist on the live API root.
      - name: Check the specs against the live API
        env:
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: make contract

  acceptance-test:
    runs-on: ubuntu-latest
    needs: [unit-test, build]
    if: *live-api-gate

    environment: *live-api-environment

    steps:
      - *checkout-code
      - *setup-go

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run integration tests
        env:
          TF_ACC: "1"
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: make test-integration

  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-test, build, contract, acceptance-test]
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          results=(
            "${{ needs.unit-test.result }}"
            "${{ needs.build.result }}"
            "${{ needs.contract.result }}"
            "${{ needs.acceptance-test.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
