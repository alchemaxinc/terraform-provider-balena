name: Check Balena API Schema

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  check-schema:
    name: Check for schema updates
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      branch: ${{ steps.push-branch.outputs.branch }}
      commit_type: ${{ steps.commit-type.outputs.type }}
      prompt: ${{ steps.prompt.outputs.text }}
      current_tag: ${{ steps.current.outputs.tag }}
      latest_tag: ${{ steps.latest.outputs.tag }}

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          # Not a hardcoded `main`: a dispatch runs the workflow definition from
          # the ref it was dispatched on, so pinning the checkout would pair new
          # steps with old files. Scheduled runs get `main` from this anyway.
          ref: ${{ github.ref }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq ".id")
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Sweep orphaned schema branches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Copilot copies the schema commit onto a branch of its own and never
          # opens a pull request for the one pushed here, so it is left behind
          # once its task finishes. Sweep before pushing a new one, so a branch
          # still being read by a running task is never pulled out from under it.
          gh api "repos/${REPOSITORY}/branches" --paginate --jq '.[].name' \
            | { grep -E '^(feat|fix|chore)!?/schema-update-' || true; } \
            | while read -r BRANCH; do
                if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
                  continue
                fi

                gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${BRANCH}"
                echo "::notice::Deleted orphaned branch ${BRANCH}"
              done

      - name: Read current pinned version
        id: current
        run: |
          CURRENT_TAG=$(tr -d '[:space:]' < schema/VERSION)
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "Current pinned version: $CURRENT_TAG"

      - name: Fetch latest open-balena-api tag
        id: latest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          LATEST_TAG=$(gh api repos/balena-io/open-balena-api/tags --jq '.[0].name')

          # This value is controlled by an upstream repository and flows into
          # branch names, commit messages and later shell steps, so reject
          # anything that is not a plain version-like token before using it.
          if [[ ! $LATEST_TAG =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]; then
            echo "::error::Refusing to use upstream tag '$LATEST_TAG': expected only letters, digits, '.', '_', '+' or '-'."
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.tag }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Schema is up to date at $CURRENT"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Schema update available: $CURRENT → $LATEST"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine semantic commit type
        if: steps.compare.outputs.needs_update == 'true'
        id: commit-type
        env:
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail

          SEMVER='^v?([0-9]+)\.([0-9]+)\.([0-9]+)$'

          if [[ ! "$CURRENT_TAG" =~ $SEMVER ]]; then
            echo "::error::Pinned version '${CURRENT_TAG}' is not a semantic version."
            exit 1
          fi
          CURRENT=("${BASH_REMATCH[@]:1:3}")

          if [[ ! "$LATEST_TAG" =~ $SEMVER ]]; then
            echo "::error::Upstream version '${LATEST_TAG}' is not a semantic version."
            exit 1
          fi
          LATEST=("${BASH_REMATCH[@]:1:3}")

          if [[ "${CURRENT[0]}" != "${LATEST[0]}" ]]; then
            TYPE="feat!"
          elif [[ "${CURRENT[1]}" != "${LATEST[1]}" ]]; then
            TYPE="feat"
          elif [[ "${CURRENT[2]}" != "${LATEST[2]}" ]]; then
            TYPE="fix"
          else
            TYPE="chore"
          fi

          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          # Copilot derives its own branch from ours and strips the punctuation,
          # turning `feat!/schema-update-v49.0.5` into `copilot/featschema-update-v4905`.
          echo "slug=${TYPE%!}" >> "$GITHUB_OUTPUT"

      - name: Download new schema
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/balena-io/open-balena-api/${LATEST}/src/balena.sbvr" \
            -o /tmp/balena-new.sbvr
          echo "Downloaded balena.sbvr from $LATEST"

      - name: Diff schema
        if: steps.compare.outputs.needs_update == 'true'
        id: diff
        run: |
          if diff -q schema/balena.sbvr /tmp/balena-new.sbvr > /dev/null 2>&1; then
            echo "No schema diff — only non-schema changes in the release"
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "Schema has changed"
            echo "has_diff=true" >> "$GITHUB_OUTPUT"

            DIFF_SUMMARY=$(bash schema/diff-sbvr.sh schema/balena.sbvr /tmp/balena-new.sbvr)

            # The summary is derived from upstream schema text. A fixed delimiter
            # would let that text close the heredoc early and append
            # attacker-chosen step outputs, so use one it cannot predict.
            DELIMITER="DIFF_EOF_$(openssl rand -hex 16)"
            {
              echo "summary<<${DELIMITER}"
              echo "$DIFF_SUMMARY"
              echo "${DELIMITER}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Update VERSION only (no schema diff)
        if: steps.compare.outputs.needs_update == 'true' && steps.diff.outputs.has_diff == 'false'
        env:
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          echo "$LATEST" > schema/VERSION

      - name: Look for an existing VERSION bump pull request
        if: steps.compare.outputs.needs_update == 'true' && steps.diff.outputs.has_diff == 'false'
        id: existing-version-pr
        uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: main
          pr-title: "chore: bump schema VERSION to ${{ steps.latest.outputs.tag }}"

      - name: Create VERSION bump PR
        if: steps.compare.outputs.needs_update == 'true' && steps.diff.outputs.has_diff == 'false' && steps.existing-version-pr.outputs.exists == 'false'
        id: create-version-pr
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: main
          branch-prefix: chore/schema-version
          branch-postfix: ${{ steps.latest.outputs.tag }}
          files: "schema/VERSION"
          commit-message: "chore: bump schema VERSION to ${{ steps.latest.outputs.tag }}"
          pr-title: "chore: bump schema VERSION to ${{ steps.latest.outputs.tag }}"
          pr-body: |
            The upstream `open-balena-api` release `${{ steps.latest.outputs.tag }}` contains no
            changes to `schema/balena.sbvr`, so only the pinned version is bumped
            from `${{ steps.current.outputs.tag }}`.

            No provider changes are needed, so this pull request auto-merges once
            CI passes.

      - name: Enable auto-merge on the VERSION bump PR
        if: steps.create-version-pr.outputs.pr_number != ''
        uses: alchemaxinc/composite-toolbox/merge-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.create-version-pr.outputs.pr_number }}
          merge-method: squash

      - name: Update schema files
        if: steps.compare.outputs.needs_update == 'true' && steps.diff.outputs.has_diff == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          cp /tmp/balena-new.sbvr schema/balena.sbvr
          echo "$LATEST" > schema/VERSION

      - name: Push schema update branch
        if: steps.compare.outputs.needs_update == 'true' && steps.diff.outputs.has_diff == 'true'
        id: push-branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.commit-type.outputs.slug }}/schema-update-${{ steps.latest.outputs.tag }}
          COMMIT_TYPE: ${{ steps.commit-type.outputs.type }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail

          # Copilot opens the pull request. A task started against a head_ref that
          # already has an open pull request only answers review comments and drops
          # the prompt, so refuse to start one that would silently do nothing.
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            echo "::error::A pull request is already open for ${BRANCH}. Close it and delete the branch before re-running."
            exit 1
          fi

          git checkout -b "$BRANCH"
          git add schema/balena.sbvr schema/VERSION
          git commit -m "${COMMIT_TYPE}: update balena schema to ${LATEST}"
          git push --force-with-lease origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build the agent prompt
        if: steps.push-branch.outputs.branch != ''
        id: prompt
        env:
          BRANCH: ${{ steps.push-branch.outputs.branch }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          COMMIT_TYPE: ${{ steps.commit-type.outputs.type }}
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}
        run: |
          set -euo pipefail

          # Built here rather than in the job that starts the task: that job holds
          # the PAT, so it deliberately has no checkout to read this file with.
          PROMPT=$(cat .github/prompts/schema-update.md)
          PROMPT="${PROMPT//VERSION_PLACEHOLDER/$LATEST_TAG}"
          PROMPT="${PROMPT//TYPE_PLACEHOLDER/$COMMIT_TYPE}"
          PROMPT="${PROMPT//BRANCH_PLACEHOLDER/$BRANCH}"
          PROMPT="${PROMPT}

          Schema version ${CURRENT_TAG} -> ${LATEST_TAG}. Diff summary follows.

          ${DIFF_SUMMARY}"

          if printf '%s' "$PROMPT" | grep -q 'PLACEHOLDER'; then
            echo "::error::Unsubstituted placeholder left in the agent prompt."
            exit 1
          fi

          DELIMITER="PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "text<<${DELIMITER}"
            echo "$PROMPT"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  start-copilot-task:
    name: Start Copilot task
    needs: check-schema
    if: needs.check-schema.outputs.branch != ''
    runs-on: ubuntu-latest

    # Needs a deployment branch rule limited to `main`: workflow_dispatch runs the
    # definition from the dispatched ref, so a plain repository secret would be
    # readable by a modified copy of this workflow on any branch.
    environment: copilot-agent

    # Holds a long-lived user PAT: the agent tasks API rejects GitHub App
    # installation tokens, and an App-authored @copilot comment is ignored. No
    # checkout and no third-party actions, so nothing here can be coerced into
    # reading it.
    permissions: {}

    env:
      # Identifiers the API accepts are not all published, and change as models
      # are released. An unknown or disabled one fails the request outright with
      # "model not found or not enabled for user".
      COPILOT_MODEL: claude-opus-5

    steps:
      - name: Start Copilot cloud agent task
        id: task
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ needs.check-schema.outputs.branch }}
          PROMPT: ${{ needs.check-schema.outputs.prompt }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret COPILOT_AGENT_TOKEN is not set. The agent tasks API accepts user-to-server tokens only."
            exit 1
          fi

          # jq keeps values out of shell and JSON syntax; stdin keeps the token off
          # the command line.
          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg head "refs/heads/$BRANCH" \
            --arg model "$COPILOT_MODEL" \
            '{
              prompt: $prompt,
              model: $model,
              head_ref: $head,
              base_ref: "refs/heads/main",
              create_pull_request: true
            }' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "agents/repos/${REPOSITORY}/tasks" \
              --input -)

          TASK_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$TASK_ID" ]; then
            echo "::error::Agent task was not created."
            exit 1
          fi

          echo "::notice::Copilot task ${TASK_ID} started on ${BRANCH} (${COPILOT_MODEL})"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Retitle the pull request Copilot opened
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          TITLE: "${{ needs.check-schema.outputs.commit_type }}: update balena schema to ${{ needs.check-schema.outputs.latest_tag }}"
        run: |
          set -euo pipefail

          # The tasks API takes no title, and the agent cannot set one itself, so
          # it opens the pull request as "[WIP] ...". Nothing else can fix it up:
          # Actions runs on an agent's pull request stay blocked until a human
          # presses "Approve and run workflows", so a pull_request job never fires.
          for _ in $(seq 1 30); do
            # Tolerate a failed poll rather than abandoning the retitle: `artifacts`
            # is absent until the pull request exists, and a transient API error
            # would otherwise end the step on the spot under `set -e`.
            NODE_ID=$(gh api "agents/repos/${REPOSITORY}/tasks/${TASK_ID}" \
              --jq '[.artifacts[]? | select(.type == "pull") | .data.global_id? | select(. != "")] | last // empty' || true)

            if [ -n "$NODE_ID" ]; then
              break
            fi

            sleep 10
          done

          if [ -z "${NODE_ID:-}" ]; then
            echo "::warning::Copilot has not opened a pull request yet. Retitle it to '${TITLE}' by hand."
            exit 0
          fi

          # Leave it a draft: marking it ready would start CI on unfinished work.
          gh api graphql \
            -f query='mutation($id: ID!, $title: String!) {
              updatePullRequest(input: { pullRequestId: $id, title: $title }) {
                pullRequest { number }
              }
            }' \
            -f id="$NODE_ID" \
            -f title="$TITLE" \
            --jq '.data.updatePullRequest.pullRequest.number' \
            | xargs -I {} echo "::notice::Retitled pull request #{} to '${TITLE}'"
