name: Check Balena API Schema

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: check-schema
  cancel-in-progress: false

env:
  PRETTIER_VERSION: "3.3.3"
  TFPLUGINDOCS_VERSION: "0.24.0"

jobs:
  regenerate:
    name: Regenerate from upstream
    runs-on: ubuntu-latest

    # Holds BALENA_API_TOKEN for the read-only contract checks, as in test.yml. Every pull request's tests can already
    # read that development token, so a branch rule would protect nothing here. This job builds and runs code from the
    # repository and from upstream, so it holds no write token: it uploads the generated files and the publish job
    # pushes them.
    environment: development

    permissions:
      contents: read

    outputs:
      sha: ${{ steps.checkout.outputs.sha }}
      changed: ${{ steps.changes.outputs.changed }}
      ok: ${{ steps.verdict.outputs.ok }}
      oba: ${{ steps.tags.outputs.oba }}
      sdk: ${{ steps.tags.outputs.sdk }}
      root: ${{ steps.promote.outputs.root }}
      type: ${{ steps.title.outputs.type }}
      slug: ${{ steps.title.outputs.slug }}
      title: ${{ steps.title.outputs.title }}
      branch: ${{ steps.title.outputs.branch }}
      body: ${{ steps.body.outputs.text }}
      prompt: ${{ steps.prompt.outputs.text }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A dispatch runs the workflow definition from the ref it was dispatched on, so the files it reads come from
          # that same ref. Scheduled runs resolve to `main`.
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Record the regenerated commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install tfplugindocs
        run: |
          go install "github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v${TFPLUGINDOCS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve the latest upstream tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Each tag is checked against a strict pattern before it is used: it flows into branch names, commit
          # messages and later shell steps.
          OBA_TAG=$(bash .github/scripts/schema-update.sh resolve-tag balena-io/open-balena-api)
          SDK_TAG=$(bash .github/scripts/schema-update.sh resolve-tag balena-io/balena-sdk)
          {
            echo "oba=$OBA_TAG"
            echo "sdk=$SDK_TAG"
            echo "oba_branch=$(bash .github/scripts/schema-update.sh branch-safe "$OBA_TAG")"
            echo "sdk_branch=$(bash .github/scripts/schema-update.sh branch-safe "$SDK_TAG")"
          } >> "$GITHUB_OUTPUT"
          echo "Latest upstream tags: open-balena-api ${OBA_TAG}, balena-sdk ${SDK_TAG}"

      # Same as `make fetch ARGS=-latest`, with the tags resolved and validated above. A failure here is an
      # infrastructure problem, not a schema change, and fails the run without starting the agent.
      - name: Pin the upstream models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBA_TAG: ${{ steps.tags.outputs.oba }}
          SDK_TAG: ${{ steps.tags.outputs.sdk }}
        run: go run ./cmd/balena-schema fetch -open-balena-api "$OBA_TAG" -balena-sdk "$SDK_TAG"

      # A locked root newer than the default root becomes the default root when it builds and passes its live
      # contract. Otherwise the current root stays and the run goes on; the summary and a warning say why.
      - name: Promote a newer API root
        id: promote
        env:
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: |
          set -euo pipefail
          SUMMARY="$RUNNER_TEMP/promotion.md"
          go run ./cmd/balena-schema promote-root -apply -json -markdown "$SUMMARY" > "$RUNNER_TEMP/promotion.json"
          # The plan quotes upstream text (parse errors, contract failures): sanitise it wherever it is rendered.
          head -n 200 "$SUMMARY" | bash .github/scripts/schema-update.sh sanitize-markdown >> "$GITHUB_STEP_SUMMARY"

          STATUS=$(jq -r '.status' "$RUNNER_TEMP/promotion.json")
          CANDIDATE=$(jq -r '.candidate // empty' "$RUNNER_TEMP/promotion.json")
          case "$STATUS" in
            none) ;;
            promoted)
              [[ $CANDIDATE =~ ^v[1-9][0-9]{0,2}$ ]] || { echo "::error::Unexpected root name."; exit 1; }
              echo "root=$CANDIDATE" >> "$GITHUB_OUTPUT"
              echo "::notice title=API root promoted::/${CANDIDATE} is the new default root."
              ;;
            blocked)
              [[ $CANDIDATE =~ ^v[1-9][0-9]{0,2}$ ]] || { echo "::error::Unexpected root name."; exit 1; }
              echo "::warning title=API root not promoted::/${CANDIDATE} is newer than the default root but was not promoted; see the job summary."
              ;;
            *)
              echo "::error::Unexpected promotion status."
              exit 1
              ;;
          esac

      - name: Regenerate
        id: generate
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/gates"
          mkdir -p "$LOGS"
          if ! go run ./cmd/balena-schema generate > "$LOGS/generate.log" 2>&1; then
            echo "generate" >> "$LOGS/failed"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Generation failed::The generator rejected the new upstream models; see the agent prompt."
          elif ! { make docs && npx --yes "prettier@${PRETTIER_VERSION}" --write docs/; } > "$LOGS/docs.log" 2>&1; then
            echo "docs" >> "$LOGS/failed"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Docs failed::The regenerated provider does not build its docs; see the agent prompt."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the gates
        id: gates
        if: steps.generate.outputs.ok == 'true'
        env:
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: |
          set -euo pipefail
          # check-generate: lock hashes, source cross-check, gap check, overrides, and no stale generated file.
          # build-and-unit-tests: the regenerated provider builds and its unit tests pass.
          # contract: read-only GETs of every generated table and column on the live default root.
          if bash .github/scripts/schema-update.sh gates "$RUNNER_TEMP/gates" >> "$GITHUB_STEP_SUMMARY"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Schema gates failed::At least one gate failed; nothing is merged."
          fi

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          read -r -a PATHS <<< "$(bash .github/scripts/schema-update.sh generated-paths)"
          if [ -n "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed upstream that affects the provider."
          fi

      - name: Determine the commit type and title
        id: title
        if: steps.changes.outputs.changed == 'true' || steps.gates.outputs.ok != 'true'
        env:
          OBA_TAG: ${{ steps.tags.outputs.oba }}
          SDK_TAG: ${{ steps.tags.outputs.sdk }}
          OBA_BRANCH: ${{ steps.tags.outputs.oba_branch }}
          SDK_BRANCH: ${{ steps.tags.outputs.sdk_branch }}
          ROOT: ${{ steps.promote.outputs.root }}
          GATES_OK: ${{ steps.gates.outputs.ok }}
        run: |
          set -euo pipefail
          # The commit type comes from the Terraform surface diff against the committed surface lock, not from the
          # upstream version. When the gates fail the diff may be unavailable; feat! never understates a change.
          BASE="$RUNNER_TEMP/base-surface.lock.json"
          git show HEAD:schema/surface.lock.json > "$BASE"
          TYPE='feat!'
          if [ "$GATES_OK" = "true" ]; then
            TYPE=$(bash .github/scripts/schema-update.sh commit-type "$BASE" schema/surface.lock.json)
          fi
          TITLE=$(bash .github/scripts/schema-update.sh title "$TYPE" "$OBA_TAG" "$SDK_TAG" "$ROOT")
          {
            echo "type=$TYPE"
            echo "slug=${TYPE%!}"
            echo "title=$TITLE"
            # The branch the failing state is pushed to for the agent.
            echo "branch=${TYPE%!}/schema-update-${OBA_BRANCH}-${SDK_BRANCH}"
          } >> "$GITHUB_OUTPUT"

          go run ./cmd/balena-schema surface-diff -old "$BASE" -new schema/surface.lock.json > "$RUNNER_TEMP/surface-diff.txt" 2>&1 || true
          echo "Commit type: ${TYPE}"

      - name: Build the pull request body
        id: body
        if: steps.changes.outputs.changed == 'true' && steps.gates.outputs.ok == 'true'
        env:
          OBA_TAG: ${{ steps.tags.outputs.oba }}
          SDK_TAG: ${{ steps.tags.outputs.sdk }}
        run: |
          set -euo pipefail
          BODY=$(
            echo "Regenerated from open-balena-api \`${OBA_TAG}\` and balena-sdk \`${SDK_TAG}\`. Every gate passed, so"
            echo "this pull request merges itself once CI passes."
            echo
            head -n 200 "$RUNNER_TEMP/promotion.md" | bash .github/scripts/schema-update.sh sanitize-markdown
            echo
            echo "Terraform surface change (the commit type comes from it):"
            echo
            echo '```'
            head -n 200 "$RUNNER_TEMP/surface-diff.txt" | bash .github/scripts/schema-update.sh sanitize
            echo '```'
          )

          # The body carries text derived from upstream models. A fixed delimiter would let that text close the
          # heredoc early and append attacker-chosen step outputs, so use one it cannot predict.
          DELIMITER="BODY_EOF_$(openssl rand -hex 16)"
          {
            echo "text<<${DELIMITER}"
            echo "$BODY"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build the agent prompt
        id: prompt
        if: steps.generate.outputs.ok != 'true' || steps.gates.outputs.ok != 'true'
        env:
          BRANCH: ${{ steps.title.outputs.branch }}
          TITLE: ${{ steps.title.outputs.title }}
        run: |
          set -euo pipefail

          # The job that starts the task holds the PAT and has no checkout, so the prompt is assembled here and
          # passed to it. The publish job pushes the branch it names.
          PROMPT=$(bash .github/scripts/schema-update.sh prompt .github/prompts/schema-update.md "$BRANCH" "$TITLE" "$RUNNER_TEMP/gates")

          DELIMITER="PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "text<<${DELIMITER}"
            echo "$PROMPT"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      # Only the generated paths, as git sees them (new files included, ignored files left out), go to the publish job.
      - name: Collect the generated files
        if: steps.changes.outputs.changed == 'true' || steps.generate.outputs.ok != 'true' || steps.gates.outputs.ok != 'true'
        run: |
          set -euo pipefail
          read -r -a PATHS <<< "$(bash .github/scripts/schema-update.sh generated-paths)"
          STAGE="$RUNNER_TEMP/generated"
          mkdir -p "$STAGE"
          git add -A -- "${PATHS[@]}"
          git ls-files -z -- "${PATHS[@]}" | tar --null -T - -cf - | tar -xf - -C "$STAGE"

      - name: Upload the generated files
        if: steps.changes.outputs.changed == 'true' || steps.generate.outputs.ok != 'true' || steps.gates.outputs.ok != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: ${{ runner.temp }}/generated
          if-no-files-found: error
          retention-days: 1
          # A re-run uploads again under the same name.
          overwrite: true

      # Set last: an infrastructure failure in any step above leaves it empty, and the publish job then does nothing.
      - name: Record the verdict
        id: verdict
        env:
          GENERATE_OK: ${{ steps.generate.outputs.ok }}
          GATES_OK: ${{ steps.gates.outputs.ok }}
        run: |
          if [ "$GENERATE_OK" = "true" ] && [ "$GATES_OK" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run when a gate failed
        if: steps.generate.outputs.ok != 'true' || steps.gates.outputs.ok != 'true'
        run: |
          echo "::error::A schema gate failed. Nothing was merged; the publish job pushes the failing state for a Copilot task."
          exit 1

  publish:
    name: Publish the regenerated files
    needs: regenerate
    # The regenerate job fails on purpose when a gate fails, after uploading the failing state for the agent. The
    # environment admits only `main`, so a dispatch from another branch regenerates and checks but publishes nothing.
    if: always() && needs.regenerate.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The GitHub App key lives in this environment, which only `main` may use. This job runs only git, gh, the
    # composite actions and the helper scripts of `main`: the regenerated files arrive as data and are never executed.
    environment: housekeeping

    # Pushes and pull requests use the GitHub App token, so pull requests it opens run CI.
    permissions:
      contents: read

    outputs:
      branch: ${{ steps.failure-branch.outputs.branch }}
      title: ${{ steps.check.outputs.title }}

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Pushes branches, deletes swept branches, opens and auto-merges pull requests; nothing else.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq ".id")
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Sweep orphaned schema branches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Copilot copies the schema commit onto a branch of its own, leaving the one pushed here behind once its
          # task finishes. A running task reads that branch minutes after the push, so keep recent ones.
          CUTOFF=$(date -u -d '6 hours ago' +%s)

          gh api "repos/${REPOSITORY}/branches" --paginate --jq '.[].name' \
            | { grep -E '^(feat|fix|chore)!?/schema-update-' || true; } \
            | while read -r BRANCH; do
                if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
                  continue
                fi

                PUSHED=$(gh api "repos/${REPOSITORY}/commits/${BRANCH}" --jq '.commit.committer.date' || true)

                if [ -z "$PUSHED" ]; then
                  echo "Keeping ${BRANCH}: could not read when it was last pushed"
                  continue
                fi

                if [ "$(date -u -d "$PUSHED" +%s)" -gt "$CUTOFF" ]; then
                  echo "Keeping ${BRANCH}: pushed ${PUSHED}, a task may still be reading it"
                  continue
                fi

                gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${BRANCH}"
                echo "::notice::Deleted orphaned branch ${BRANCH}"
              done

      # The regenerate job runs upstream code, so its outputs are untrusted: the title and branch are derived again with
      # the helpers of `main` and must match, and the regenerated commit must be on `main`.
      - name: Check the regenerated state
        id: check
        if: >-
          (needs.regenerate.outputs.ok == 'true' && needs.regenerate.outputs.changed == 'true')
          || needs.regenerate.outputs.ok == 'false'
        env:
          SHA: ${{ needs.regenerate.outputs.sha }}
          TYPE: ${{ needs.regenerate.outputs.type }}
          SLUG: ${{ needs.regenerate.outputs.slug }}
          TITLE: ${{ needs.regenerate.outputs.title }}
          BRANCH: ${{ needs.regenerate.outputs.branch }}
          OBA_TAG: ${{ needs.regenerate.outputs.oba }}
          SDK_TAG: ${{ needs.regenerate.outputs.sdk }}
          ROOT: ${{ needs.regenerate.outputs.root }}
        run: |
          set -euo pipefail
          if [[ ! $SHA =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$SHA" HEAD; then
            echo "::error::The regenerated commit is not on main."
            exit 1
          fi
          EXPECTED_TITLE=$(bash .github/scripts/schema-update.sh title "$TYPE" "$OBA_TAG" "$SDK_TAG" "$ROOT")
          POSTFIX="$(bash .github/scripts/schema-update.sh branch-safe "$OBA_TAG")-$(bash .github/scripts/schema-update.sh branch-safe "$SDK_TAG")"
          if [ "$TITLE" != "$EXPECTED_TITLE" ] || [ "$SLUG" != "${TYPE%!}" ] || [ "$BRANCH" != "${SLUG}/schema-update-${POSTFIX}" ]; then
            echo "::error::The regenerate job's title or branch does not match its tags."
            exit 1
          fi
          # Branch from the commit that was regenerated, as main may have moved since.
          git checkout -q --detach "$SHA"
          {
            echo "title=$EXPECTED_TITLE"
            echo "slug=${TYPE%!}"
            echo "postfix=$POSTFIX"
            echo "branch=${TYPE%!}/schema-update-${POSTFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Download the generated files
        if: steps.check.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: generated
          path: ${{ runner.temp }}/generated

      - name: Apply the generated files
        id: changes
        if: steps.check.outcome == 'success'
        env:
          REGENERATE_OK: ${{ needs.regenerate.outputs.ok }}
        run: |
          set -euo pipefail
          read -r -a PATHS <<< "$(bash .github/scripts/schema-update.sh generated-paths)"
          # Copies only regular files under the generated paths and rejects everything else.
          bash .github/scripts/apply-artifact.sh "$RUNNER_TEMP/generated" . "${PATHS[@]}"
          if [ -n "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$REGENERATE_OK" = "true" ]; then
            echo "::warning::The regenerate job reported changes, but its files match main; nothing to publish."
          fi

      - name: Look for an existing pull request
        id: existing-pr
        if: needs.regenerate.outputs.ok == 'true' && steps.changes.outputs.changed == 'true'
        uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: main
          pr-title: ${{ steps.check.outputs.title }}

      - name: Create the pull request
        id: create-pr
        if: needs.regenerate.outputs.ok == 'true' && steps.changes.outputs.changed == 'true' && steps.existing-pr.outputs.exists == 'false'
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: main
          branch-prefix: ${{ steps.check.outputs.slug }}/schema-update
          branch-postfix: ${{ steps.check.outputs.postfix }}
          files: "schema docs examples internal/provider/zz_generated_specs.go"
          commit-message: ${{ steps.check.outputs.title }}
          pr-title: ${{ steps.check.outputs.title }}
          pr-body: ${{ needs.regenerate.outputs.body }}

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_number != ''
        uses: alchemaxinc/composite-toolbox/merge-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pr_number }}
          merge-method: squash

      - name: Push the failing state for the agent
        id: failure-branch
        if: needs.regenerate.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TITLE: ${{ steps.check.outputs.title }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -euo pipefail

          # Copilot opens the pull request. A task started against a head_ref that already has an open pull request
          # only answers review comments and drops the prompt, so refuse to start one that would silently do nothing.
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            echo "::error::A pull request is already open for ${BRANCH}. Close it and delete the branch before re-running."
            exit 1
          fi

          read -r -a PATHS <<< "$(bash .github/scripts/schema-update.sh generated-paths)"
          git checkout -b "$BRANCH"
          git add -A -- "${PATHS[@]}"
          # Commit even when nothing changed (the current root failing its contract), so the agent has a branch.
          git commit --allow-empty -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  start-copilot-task:
    name: Start Copilot task
    needs: [regenerate, publish]
    # The regenerate job fails on purpose when a gate fails; the publish job then pushes the branch for the agent.
    if: always() && needs.publish.outputs.branch != ''
    runs-on: ubuntu-latest

    # Limited to `main` by a deployment branch rule: workflow_dispatch runs the workflow definition from the dispatched
    # ref, so a plain repository secret would be readable by a modified copy of this workflow on any branch.
    environment: copilot-agent

    # Holds a long-lived user PAT: the agent tasks API rejects GitHub App installation tokens, and an App-authored
    # @copilot comment is ignored. No checkout and no third-party actions, so nothing here can be coerced into
    # reading it.
    permissions: {}

    env:
      # Identifiers the API accepts are not all published, and change as models are released. An unknown or disabled
      # one fails the request outright with "model not found or not enabled for user".
      COPILOT_MODEL: claude-opus-5

    steps:
      - name: Start Copilot cloud agent task
        id: task
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          PROMPT: ${{ needs.regenerate.outputs.prompt }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret COPILOT_AGENT_TOKEN is not set. The agent tasks API accepts user-to-server tokens only."
            exit 1
          fi

          # jq keeps values out of shell and JSON syntax; stdin keeps the token off the command line.
          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg head "refs/heads/$BRANCH" \
            --arg model "$COPILOT_MODEL" \
            '{
              prompt: $prompt,
              model: $model,
              head_ref: $head,
              base_ref: "refs/heads/main",
              create_pull_request: true
            }' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "agents/repos/${REPOSITORY}/tasks" \
              --input -)

          TASK_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$TASK_ID" ]; then
            echo "::error::Agent task was not created."
            exit 1
          fi

          echo "::notice::Copilot task ${TASK_ID} started on ${BRANCH} (${COPILOT_MODEL})"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Retitle the pull request Copilot opened
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          TITLE: ${{ needs.publish.outputs.title }}
        run: |
          set -euo pipefail

          # The tasks API takes no title and the agent cannot set one itself, so it opens the pull request as
          # "[WIP] ...". Actions runs on an agent's pull request stay blocked until a human presses "Approve and run
          # workflows", so this cannot be done from a pull_request job.
          OWNER="${REPOSITORY%%/*}"

          for _ in $(seq 1 30); do
            # Artifacts are absent until the pull request exists, and a poll may fail transiently; both retry on the
            # next tick.
            TASK=$(gh api "agents/repos/${REPOSITORY}/tasks/${TASK_ID}" || true)

            # `data.id` is the pull request's database id, set as soon as the pull request exists.
            PR_ID=$(printf '%s' "$TASK" | jq -r '[.artifacts[]? | select(.type == "pull") | .data.id? | numbers] | last // empty')
            HEAD_REF=$(printf '%s' "$TASK" | jq -r '[.artifacts[]? | select(.type == "branch") | .data.head_ref? | strings] | last // empty')

            if [ -n "$PR_ID" ] && [ -n "$HEAD_REF" ]; then
              # The agent reuses branch names across runs, so an earlier pull request can share this head.
              PR_NUMBER=$(gh api "repos/${REPOSITORY}/pulls?state=open&head=${OWNER}:${HEAD_REF}" \
                --jq "[.[] | select(.id == ${PR_ID}) | .number] | first // empty" || true)

              if [ -n "$PR_NUMBER" ]; then
                break
              fi
            fi

            sleep 10
          done

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::Copilot has not opened a pull request yet. Retitle it to '${TITLE}' by hand."
            exit 0
          fi

          # Leave it a draft: marking it ready would start CI on unfinished work.
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -f title="$TITLE" > /dev/null

          echo "::notice::Retitled pull request #${PR_NUMBER} to '${TITLE}'"
